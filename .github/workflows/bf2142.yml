name: BF2142 Server Monitor

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a Discord and ntfy test alert"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run BF2142 monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: |
          python bf2142_monitor.py

      - name: Save changed server state
        run: |
          if git diff --quiet server_state.json; then
            echo "No server state changes."
            exit 0
          fi

          git config user.name "BF2142 Monitor"
          git config user.email "bf2142-monitor@users.noreply.github.com"

          git add server_state.json
          git commit -m "Update BF2142 server state"
          git push
