name: BF2142 Server Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run BF2142 monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python bf2142_monitor.py

      - name: Save server state
        run: |
          git config user.name "BF2142 Monitor"
          git config user.email "bf2142-monitor@users.noreply.github.com"
          git add server_state.json
          git diff --cached --quiet || git commit -m "Update server state"
          git push
